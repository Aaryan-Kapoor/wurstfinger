name: Set up Swift Bundler
description: >-
  Installs Swift Bundler (moreSwift/swift-bundler) with Mint, pinned to one
  commit, and caches the build. Every workflow that bundles the app uses this
  action, so the pin lives here and nowhere else. Requires the Xcode (or Swift
  toolchain) the workflow wants Swift Bundler built with to be selected first.

inputs:
  ref:
    description: Commit of moreSwift/swift-bundler to build (v3.0.0 development line)
    required: false
    # Bump together with the version noted in README.md.
    default: d97771d6af71784497749b34c4f71460abf9aa4b

runs:
  using: composite
  steps:
    - name: Cache Swift Bundler
      id: cache
      uses: actions/cache@v5
      with:
        path: ~/.mint
        key: swift-bundler-${{ runner.os }}-${{ runner.arch }}-${{ inputs.ref }}

    - name: Install Swift Bundler
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        brew install mint
        mint install "moreSwift/swift-bundler@${{ inputs.ref }}"

    - name: Put Swift Bundler on PATH
      shell: bash
      run: |
        echo "$HOME/.mint/bin" >> "$GITHUB_PATH"
        "$HOME/.mint/bin/swift-bundler" --version
