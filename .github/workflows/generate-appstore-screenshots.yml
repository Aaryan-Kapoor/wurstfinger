name: Generate App Store Screenshots

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload screenshots as artifact'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  generate-screenshots:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Render with the same Xcode 26 toolchain the app is built with, not the
      # image default (Xcode 16.4 on macos-15).
      - name: Select Xcode 26
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode 26 installation found on the runner image"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      # No simulator: WurstfingerSnapshots renders AppStoreScreenshotView with
      # SwiftUI's ImageRenderer on the Mac, at the App Store pixel sizes
      # (iPhone 6.9" and 6.5").
      # TODO: confirm the `--filter` spelling against the tool's --help once the
      # snapshot tool has merged; the staging script below only relies on the
      # PNGs' pixel widths and their sorted file names.
      - name: Render App Store screenshots
        run: |
          swift run -c release WurstfingerSnapshots \
            --out "$RUNNER_TEMP/appstore-raw" \
            --filter AppStoreScreenshotView
        timeout-minutes: 30

      - name: Stage screenshots for deliver
        run: ./scripts/stage-appstore-screenshots.sh "$RUNNER_TEMP/appstore-raw" fastlane/screenshots

      - name: List generated screenshots
        run: |
          echo "Generated screenshots:"
          find fastlane/screenshots -type f -name "*.png" | sort

          echo ""
          echo "Screenshot sizes:"
          for file in $(find fastlane/screenshots -type f -name "*.png" | sort); do
            size=$(sips -g pixelWidth -g pixelHeight "$file" | awk '/pixelWidth/{w=$2} /pixelHeight/{h=$2} END{print w" x "h}')
            echo "  $file: $size"
          done

      - name: Upload screenshots artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: appstore-screenshots
          path: fastlane/screenshots/
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          echo "## App Store Screenshots Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Prefix | Device | Resolution |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|------------|" >> $GITHUB_STEP_SUMMARY
          echo "| 69 | iPhone 6.9\" | 1320 x 2868 |" >> $GITHUB_STEP_SUMMARY
          echo "| 65 | iPhone 6.5\" | 1284 x 2778 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Locales: en-US, de-DE (mirrored). Download the artifact to review, then commit to fastlane/screenshots/." >> $GITHUB_STEP_SUMMARY
