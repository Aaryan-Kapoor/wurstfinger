name: PR Tests

on:
  pull_request:
    branches: [ "develop" ]

# Nothing here writes to the repository: every job reads the tree, builds it
# and reports. Declaring it keeps a same-repository pull request from running
# with whatever the repository default happens to be — fork runs are already
# read-only.
permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Tools
        run: brew install swiftlint swiftformat

      - name: Run SwiftFormat
        run: swiftformat --lint .

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  naming:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # This job runs Python out of the pull request's own tree, so it does
        # not get the checkout token left behind in .git/config.
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # A miscount would be written straight into the budget, so the counting
      # itself is tested: comments and strings must not count, interpolations must.
      - name: Test the Naming Checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # Vocabulary in glossary.toml, backlog in .naming-budget.json. The budget
      # may shrink but never grow, so a rejected spelling cannot be added to a
      # file that does not already carry one.
      - name: Check Naming Against the Glossary
        run: python3 scripts/check_naming.py check

      # Sections 7-9 of docs/GLOSSARY.md are generated from the same two files.
      - name: Check the Generated Glossary Sections
        run: python3 scripts/check_naming.py render --check

      # So are the glossary_* custom rules in .swiftlint.yml, including the
      # per-rule exclusions that keep --strict green while a backlog remains.
      - name: Check the Generated SwiftLint Rules
        run: python3 scripts/check_naming.py sync-lint --check

  markdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Rules and ignores come from .markdownlint-cli2.jsonc in the repo root.
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  dead-code:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery

      - name: Scan for Dead Code
        run: periphery scan --disable-update-check

  test:
    # macos-15 carries Xcode 26 next to the default, which the Icon Composer
    # icon needs (older actool cannot compile AppIcon.icon).
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode 26 installation found on the runner image"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Set up Swift Bundler
        uses: ./.github/actions/setup-swift-bundler

      - name: Build
        timeout-minutes: 30
        run: swift build

      - name: Run Unit Tests
        timeout-minutes: 30
        run: swift test --parallel

      # The keyboard extension is assembled by our own scripts (Swift Bundler
      # has no extension support). This checks the assembly on a fake layout.
      - name: Test the Bundle Assembly
        run: scripts/test-bundle-assembly.sh

      # The real thing, as a smoke test: Swift Bundler builds the app and the
      # keyboard for the simulator, then the script assembles and signs it.
      - name: Bundle the iOS App (Simulator)
        timeout-minutes: 30
        run: scripts/bundle-ios.sh --simulator --configuration debug

      - name: Upload the Simulator App
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Wurstfinger-simulator-app
          path: .build/bundler/apps/Wurstfinger/Wurstfinger.app
          retention-days: 7
          if-no-files-found: ignore
