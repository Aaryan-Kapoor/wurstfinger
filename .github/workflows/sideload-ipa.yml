name: Sideload IPA

# An unsigned-for-you IPA to put on your own iPhone with a sideloader (Impactor,
# SideStore, AltStore), for when there is no Xcode on hand. The sideloader signs
# it with your Apple ID. See docs/sideloading.md.
#
# Run it from the Actions tab (or `gh workflow run sideload-ipa.yml`). The IPA
# is kept as an artifact and also published on the `sideload-latest` release,
# whose download link opens straight from Safari on the phone.

on:
  # Until this is on the default branch, GitHub will not dispatch it by name, so
  # a push to this branch builds it too.
  push:
    branches: [sideload]
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: read

env:
  RELEASE_TAG: sideload-latest

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write # the release the IPA is published on

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Newest Xcode on the image; the build needs the iOS SDK and nothing else
      # of it.
      - name: Select Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode found on the runner image"
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Set up Swift Bundler
        uses: ./.github/actions/setup-swift-bundler

      - name: Build the IPA
        run: scripts/bundle-ios.sh --sideload --configuration "${{ inputs.configuration || 'release' }}" --ipa "$RUNNER_TEMP/Wurstfinger-sideload.ipa"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Wurstfinger-sideload-ipa
          path: ${{ runner.temp }}/Wurstfinger-sideload.ipa
          if-no-files-found: error
          retention-days: 14

      # One rolling pre-release, so the link never changes: the same asset name,
      # replaced on every build. Only the branch push and a manual run reach here.
      - name: Publish on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA="$RUNNER_TEMP/Wurstfinger-sideload.ipa"
          NOTES="Built from $GITHUB_SHA by run $GITHUB_RUN_ID. Signed with a throwaway certificate: a sideloader re-signs it with your Apple ID (docs/sideloading.md)."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Wurstfinger sideload build" --notes "$NOTES"
          fi
          gh release upload "$RELEASE_TAG" "$IPA" --clobber
